<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body p-4">

          <h2 class="text-center mb-4">
            Create Account
          </h2>

          <div
            *ngIf="message"
            class="alert alert-success">
            {{ message }}
          </div>

          <div
            *ngIf="errorMessage"
            class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="signup()">

            <div class="mb-3">

              <label class="form-label">
                Name
              </label>

              <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="name"
                placeholder="Enter your name"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                name="email"
                [(ngModel)]="email"
                placeholder="Enter your email"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                name="password"
                [(ngModel)]="password"
                placeholder="Enter your password"
                required>

            </div>

            <button
              type="submit"
              class="btn btn-primary w-100">

              Sign Up

            </button>

          </form>

          <div class="text-center mt-3">

            Already have an account?

            <a routerLink="/login">
              Login
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
