<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body p-4">

          <h2 class="text-center mb-4">
            Create Account
          </h2>

          <!-- Success Message -->
          <div
            *ngIf="message"
            class="alert alert-success">
            {{ message }}
          </div>

          <!-- Error Message -->
          <div
            *ngIf="errorMessage"
            class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="signup()">

            <!-- Name -->
            <div class="mb-3">

              <label class="form-label">
                Name
              </label>

              <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="name"
                placeholder="Enter your name"
                required>

            </div>


            <!-- Email -->
            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                name="email"
                [(ngModel)]="email"
                placeholder="Enter your email"
                required>

            </div>


            <!-- CMRC Name -->
            <div class="mb-3">

              <label class="form-label">
                CMRC Name
              </label>

              <input
                type="text"
                class="form-control"
                name="cmrcName"
                [(ngModel)]="cmrcName"
                placeholder="Enter CMRC name"
                required>

            </div>


            <!-- District -->
            <div class="mb-3">

              <label class="form-label">
                District
              </label>

              <select
                class="form-select"
                name="district"
                [(ngModel)]="district"
                (change)="onDistrictChange()"
                required>

                <option value="">
                  Select District
                </option>

                <option
                  *ngFor="let districtName of districts"
                  [value]="districtName">

                  {{ districtName }}

                </option>

              </select>

            </div>


            <!-- Taluka -->
            <div class="mb-3">

              <label class="form-label">
                Taluka
              </label>

              <select
                class="form-select"
                name="taluka"
                [(ngModel)]="taluka"
                [disabled]="!district"
                required>

                <option value="">
                  Select Taluka
                </option>

                <option
                  *ngFor="let talukaName of selectedTalukas"
                  [value]="talukaName">

                  {{ talukaName }}

                </option>

              </select>

            </div>


            <!-- Password -->
            <div class="mb-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                name="password"
                [(ngModel)]="password"
                placeholder="Enter your password"
                required>

            </div>


            <!-- Signup Button -->
            <button
              type="submit"
              class="btn btn-primary w-100">

              Sign Up

            </button>

          </form>


          <!-- Login Link -->
          <div class="text-center mt-3">

            Already have an account?

            <a routerLink="/login">
              Login
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
